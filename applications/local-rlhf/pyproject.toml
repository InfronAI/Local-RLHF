[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-rlhf"
version = "0.2.0"
description = "A complete local RLHF training toolkit for Apple Silicon, featuring supervised fine-tuning, reward modeling, and PPO with memory-efficient LoRA."
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[project.scripts]
local-rlhf = "local_rlhf.cli:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["local_rlhf*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
